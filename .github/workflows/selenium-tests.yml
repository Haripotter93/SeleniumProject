name: Selenium Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Clean old reports and screenshots
      - name: Clean old reports and screenshots
        run: |
          echo "Cleaning old reports..."
          rm -rf reports
          rm -rf screenshots

          mkdir -p reports
          mkdir -p screenshots

          echo "Reports directory:"
          ls -la reports

      # Start Selenium Grid
      - name: Start Selenium Grid
        run: docker compose up -d

      # Wait for Selenium Grid
      - name: Wait for Selenium Grid
        run: |
          echo "Waiting for Selenium Grid..."

          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium Grid is ready!"
              exit 0
            fi

            echo "Grid not ready yet... attempt $i/30"
            sleep 2
          done

          echo "Selenium Grid did not become ready"
          docker compose ps
          docker compose logs selenium-hub
          exit 1

      # Run Selenium tests
      - name: Run Selenium Tests
        run: mvn clean test

      # Check generated reports and screenshots
      - name: Check generated reports
        if: always()
        run: |
          echo "======================================"
          echo "REPORT FILES"
          echo "======================================"

          find reports -type f -print 2>/dev/null || true

          echo "======================================"
          echo "SCREENSHOT FILES"
          echo "======================================"

          find screenshots -type f -print 2>/dev/null || true

          echo "======================================"
          echo "REPORT COUNT"
          echo "======================================"

          find reports -type f -name "*.html" | wc -l

      # Upload ALL Extent reports
      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Test-Reports
          path: reports/
          if-no-files-found: warn

      # Upload screenshots
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Screenshots
          path: screenshots/
          if-no-files-found: warn

      # Stop Selenium Grid
      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
