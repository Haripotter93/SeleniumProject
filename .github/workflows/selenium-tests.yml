name: Selenium Tests

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

  workflow_dispatch:

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Clean old reports and screenshots
      - name: Clean old reports and screenshots
        run: |
          echo "Cleaning old reports..."
          rm -rf reports
          rm -rf screenshots

          mkdir -p reports
          mkdir -p screenshots

          echo "Reports directory:"
          ls -la reports

      # Start Selenium Grid
      - name: Start Selenium Grid
        run: |
          echo "Starting Selenium Grid..."
          docker compose up -d

          echo "======================================"
          echo "Docker Compose Status"
          echo "======================================"

          docker compose ps

      # Wait for Selenium Grid
      - name: Wait for Selenium Grid
        run: |
          echo "======================================"
          echo "Waiting for Selenium Grid..."
          echo "======================================"

          for i in {1..60}; do

            echo "Checking Selenium Grid... attempt $i/60"

            STATUS=$(curl -s http://localhost:4444/status || true)

            echo "Response:"
            echo "$STATUS"

            if echo "$STATUS" | grep -q '"ready"'; then
              echo "======================================"
              echo "Selenium Grid is responding!"
              echo "======================================"
              exit 0
            fi

            sleep 2

          done

          echo "======================================"
          echo "Selenium Grid did not become ready"
          echo "======================================"

          echo "Docker Compose Status:"
          docker compose ps

          echo "======================================"
          echo "Selenium Hub Logs"
          echo "======================================"

          docker compose logs selenium-hub --tail=100

          echo "======================================"
          echo "Chrome Node Logs"
          echo "======================================"

          docker compose logs node-chrome --tail=100

          echo "======================================"
          echo "Firefox Node Logs"
          echo "======================================"

          docker compose logs node-firefox --tail=100

          echo "======================================"
          echo "Port 4444 Check"
          echo "======================================"

          curl -v http://localhost:4444/status || true

          exit 1

      # Display Grid status
      - name: Verify Selenium Grid
        run: |
          echo "======================================"
          echo "Selenium Grid Status"
          echo "======================================"

          curl -s http://localhost:4444/status

          echo ""
          echo "======================================"
          echo "Selenium Grid UI"
          echo "======================================"

          curl -I http://localhost:4444/ui/ || true

      # Run Selenium tests
      - name: Run Selenium Tests
        run: mvn clean test

      # Check generated reports and screenshots
      - name: Check generated reports
        if: always()
        run: |
          echo "======================================"
          echo "REPORT FILES"
          echo "======================================"

          find reports -type f -print 2>/dev/null || true

          echo "======================================"
          echo "SCREENSHOT FILES"
          echo "======================================"

          find screenshots -type f -print 2>/dev/null || true

          echo "======================================"
          echo "REPORT COUNT"
          echo "======================================"

          find reports -type f -name "*.html" | wc -l

      # Upload ALL Extent reports
      - name: Upload Extent Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Extent-Test-Reports
          path: reports/
          if-no-files-found: warn

      # Upload screenshots
      - name: Upload Screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Test-Screenshots
          path: screenshots/
          if-no-files-found: warn

      # Stop Selenium Grid
      - name: Stop Selenium Grid
        if: always()
        run: docker compose down
