name: Selenium Tests

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

jobs:
  selenium-tests:
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout project
      - name: Checkout source code
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Check Java and Maven
      - name: Check Java and Maven
        run: |
          java -version
          mvn -version
          docker --version
          docker compose version

      # 4. Start Selenium Grid
      - name: Start Selenium Grid
        run: docker compose up -d

      # 5. Wait for Selenium Grid
      - name: Wait for Selenium Grid
        run: |
          echo "Waiting for Selenium Grid..."
          for i in {1..30}; do
            if curl -s http://localhost:4444/status | grep -q '"ready":true'; then
              echo "Selenium Grid is ready!"
              break
            fi
            echo "Waiting..."
            sleep 2
          done

      # 6. Display Selenium Grid status
      - name: Check Selenium Grid
        run: curl http://localhost:4444/status

      # 7. Show running containers
      - name: Docker containers
        run: docker compose ps

      # 8. Run TestNG tests through Maven
      - name: Run Selenium tests
        run: mvn clean test

      # 9. Show Docker logs if tests fail
      - name: Selenium Grid logs
        if: failure()
        run: docker compose logs

      # 10. Upload test reports
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-test-reports
          path: |
            target/surefire-reports/
            test-output/
          if-no-files-found: ignore

      # 11. Stop Selenium Grid
      - name: Stop Selenium Grid
        if: always()
        run: docker compose down